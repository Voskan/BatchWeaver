# Configuration fixture as shipped with a published BatchWeaver prerelease.
# Every published prerelease used schema 1; this fixture is loaded by the
# current (v1) loader to prove configuration continuity across the upgrade.
version: 1

compiler:
  mode: transparent

runtime:
  default_scope: request

security:
  cross_scope_batching: false
  raw_key_observability: false

observability:
  metrics: true
  tracing: true
  logging: warnings

operations:
  users.get:
    kind: read-only
    scalar:
      symbol: github.com/example/app/users.(*Repository).GetUser
    batch:
      symbol: github.com/example/app/users.(*Repository).GetUsersBatch
    results:
      mode: ordered
      missing: error
      errors: mixed
    partition:
      scope: request
      dimensions:
        - receiver
        - tenant
        - authorization
    scheduler:
      mode: adaptive
      min_size: 1
      max_size: 256
      max_wait: 500us
      deadline_margin: 200us
      max_concurrency: 8
    deduplication:
      mode: exact
      inflight: true
    fallback:
      mode: scalar
