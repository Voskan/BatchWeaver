name: Editor or LSP issue
description: Report editor, daemon, standalone LSP, or gopls-proxy behavior
title: "[Editor]: "
labels: ["kind/bug", "area/lsp", "status/needs-repro"]
body:
  - type: input
    id: versions
    attributes: {label: BatchWeaver, editor, extension, gopls, and Go versions}
    validations: {required: true}
  - type: input
    id: platform
    attributes: {label: OS and architecture}
    validations: {required: true}
  - type: textarea
    id: doctor
    attributes:
      label: Sanitized doctor output
      description: >-
        Prefer batchweaver doctor; remove local paths and anything sensitive.
  - type: textarea
    id: behavior
    attributes: {label: Expected and actual behavior}
    validations: {required: true}
  - type: textarea
    id: reproduction
    attributes: {label: Minimal reproduction and command sequence}
    validations: {required: true}
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy
      options:
        - label: I removed tokens, source contents, headers, metadata, and private workspace paths.
          required: true
