name: Transformation safety report
description: Report a reproducible scalar/transformed semantic difference (not a vulnerability)
title: "[Safety]: "
labels: ["kind/safety", "priority/p0", "status/needs-repro"]
body:
  - type: markdown
    attributes:
      value: >-
        If this may expose data, cross authorization or tenant boundaries, or
        enable exploitation, stop and use the private process in SECURITY.md.
  - type: input
    id: versions
    attributes:
      label: Versions and platform
      description: >-
        BatchWeaver, Go, OS, architecture, runtime ABI, and extension version.
    validations: {required: true}
  - type: input
    id: identity
    attributes: {label: Operation, strategy, proof, and plan IDs}
    validations: {required: true}
  - type: textarea
    id: difference
    attributes:
      label: Semantic difference
      description: >-
        Compare scalar and transformed values, errors, ordering, cancellation,
        deadlines, context, and partitions.
    validations: {required: true}
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal sanitized reproduction
      description: >-
        Provide commands and a minimal project without credentials or
        production data.
    validations: {required: true}
  - type: dropdown
    id: materialized
    attributes: {label: "Materialized?", options: ["No", "Yes, and reverted", "Yes, not yet reverted"]}
    validations: {required: true}
  - type: textarea
    id: rollback
    attributes: {label: Rollback status}
    validations: {required: true}
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy confirmation
      options:
        - label: >-
            I removed secrets, source I cannot share, request payloads, SQL
            parameters, headers, metadata, and tenant identifiers.
          required: true
