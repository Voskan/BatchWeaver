name: Documentation Pages

on:
  workflow_dispatch:
    inputs:
      confirm_deploy:
        description: Type deploy-v<release/VERSION> after publication gates pass
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The confirmation is checked against release/VERSION at the deployed
      # commit, so it cannot drift out of date at the next release.
      - name: Confirm the deployment matches the canonical version
        env:
          CONFIRM: ${{ inputs.confirm_deploy }}
        run: |
          set -euo pipefail
          EXPECTED="deploy-v$(tr -d '[:space:]' < release/VERSION)"
          if [ "$CONFIRM" != "$EXPECTED" ]; then
            printf 'confirmation %s does not match %s\n' "$CONFIRM" "$EXPECTED" >&2
            exit 1
          fi
      - run: scripts/build-docs-site.sh _site
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
